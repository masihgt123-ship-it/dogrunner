name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libmtdev-dev \
            autoconf \
            autoconf-archive \
            libtool \
            libtool-bin \
            pkg-config \
            cmake

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "count=0" > ~/.android/repositories.cfg
          find $HOME/.buildozer -name "sdkmanager" 2>/dev/null | head -1 | xargs -I{} bash -c 'yes | {} --licenses 2>/dev/null || true'

      - name: Build with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          yes | buildozer -v android debug 2>&1 | tee 0_build.txt
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dogrunner-apk
          path: bin/*.apk

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: 0_build.txt
