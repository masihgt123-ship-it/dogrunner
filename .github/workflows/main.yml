name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.11 python3.11-venv python3.11-dev \
            build-essential git zip unzip \
            openjdk-17-jdk ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libltdl-dev libtool libtool-bin \
            autoconf autoconf-archive automake pkg-config

      - name: Force Python 3.11 everywhere
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 100
          sudo update-alternatives --set python3 /usr/bin/python3.11
          sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python3
          sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python
          # تأیید که python3.14 دیگه پیش‌فرض نیست
          python3 --version
          which python3

      - name: Install pip for Python 3.11
        run: |
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade "pip<25.0" virtualenv

      - name: Install Buildozer and dependencies
        run: |
          python3.11 -m pip install buildozer cython

      - name: Patch p4a to force Python 3.11 in Android venv
        run: |
          P4A_DIR=$(python3.11 -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "Patching p4a at: $P4A_DIR"
          # جایگزینی هر ارجاع به python3 در virtualenv ساختن
          grep -rl "python3" "$P4A_DIR" --include="*.py" | xargs \
            sed -i \
              -e 's|--python=python3|--python=/usr/bin/python3.11|g' \
              -e "s|executable='python3'|executable='/usr/bin/python3.11'|g" \
              -e 's|"python3", "-m", "venv"|"/usr/bin/python3.11", "-m", "venv"|g' \
              -e "s|'python3', '-m', 'venv'|'/usr/bin/python3.11', '-m', 'venv'|g"
          echo "Patch done."

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build with Buildozer
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          P4A_PYTHON_VERSION: "3.11"
          PYTHON: /usr/bin/python3.11
          VIRTUALENV_PYTHON: /usr/bin/python3.11
        run: |
          yes | buildozer -v android debug 2>&1 | tee 0_build.txt
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dogrunner-apk
          path: bin/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: 0_build.txt
