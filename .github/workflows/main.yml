name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        # اجرای بیلد و تایید خودکار تمامی سوالات
        yes | buildozer android debug

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dogrunner-final-apk
        path: bin/*.apk
