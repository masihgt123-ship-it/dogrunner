name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            autoconf-archive \
            libtool \
            libtool-bin \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            cmake \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Debug aclocal macros
        run: |
          aclocal --print-ac-dir
          ls $(aclocal --print-ac-dir) | grep -i libtool || echo "libtool macros not found"

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee 0_build.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: 0_build.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: .buildozer/
