name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          libtool \
          autoconf \
          automake \
          libtool-bin
        # این خط جادویی برای رفع خطای LT_SYS_SYMBOL_USCORE است
        sudo apt-get install -y autoconf-archive

    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        # اجرای بیلد با فلگ verbose و ذخیره لاگ در فایل برای بررسی‌های بعدی
        buildozer -v android debug > 0_build.txt 2>&1 || (echo "Build failed! Check 0_build.txt" && exit 1)

    - name: Upload Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build_logs
        path: |
          0_build.txt
          build/
