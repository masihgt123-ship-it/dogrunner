name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.11 python3.11-venv python3.11-dev \
            python3-pip build-essential git \
            ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libltdl-dev libtool libtool-bin \
            autoconf autoconf-archive automake \
            pkg-config zip unzip openjdk-17-jdk ccache

      - name: Force Python 3.11 as default python3
        run: |
          # حذف Python 3.14 از مسیر پیش‌فرض
          sudo apt-get remove -y python3.14 python3.14-minimal || true
          # تنظیم اولویت
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 100
          sudo update-alternatives --set python3 /usr/bin/python3.11
          sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python3
          sudo ln -sf /usr/bin/python3.11 /usr/local/bin/python
          # تأیید
          python3 --version
          python --version

      - name: Install pip for Python 3.11
        run: |
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade "pip<25.0"

      - name: Install Buildozer and dependencies
        run: |
          python3.11 -m pip install --upgrade buildozer cython virtualenv

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          P4A_PYTHON_VERSION: "3.11"
          PYTHON: /usr/bin/python3.11
          VIRTUALENV_PYTHON: /usr/bin/python3.11
        run: |
          export PATH="/usr/bin:$PATH"
          yes | buildozer -v android debug 2>&1 | tee 0_build.txt
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dogrunner-apk
          path: bin/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: 0_build.txt
