name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            libtool-bin \
            pkg-config \
            cmake \
            ninja-build \
            openjdk-17-jdk \
            unzip \
            zip

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.37

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          P4A_PYTHON_VERSION: "3.11"
        run: |
          yes | buildozer -v android debug 2>&1 | tee 0_build.txt
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dogrunner-apk
          path: bin/*.apk

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: 0_build.txt
