name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Install Buildozer and dependencies
        run: |
          pip install --user buildozer cython==0.29.36
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          # اجرای بیلد و ذخیره لاگ در فایلی به نام build_log.txt
          buildozer -v android debug > build_log.txt 2>&1 || {
            echo "Build failed! Uploading logs..."
            cat build_log.txt
            exit 1
          }

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_log.txt
