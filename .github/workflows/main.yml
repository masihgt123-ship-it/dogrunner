name: Create Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.HECTOR }}
          KEY_PASSWORD: ${{ secrets.HECTOR2 }}
        run: |
          keytool -genkeypair \
            -keystore dogrunner.jks \
            -storetype JKS \
            -alias dogrunner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname "CN=Dog Runner"

      - uses: actions/upload-artifact@v4
        with:
          name: dogrunner-signing-key
          path: dogrunner.jks
          retention-days: 1
