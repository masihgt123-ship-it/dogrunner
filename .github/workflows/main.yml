- name: Install system dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      python3-pip \
      build-essential \
      git \
      ffmpeg \
      libsdl2-dev \
      libsdl2-image-dev \
      libsdl2-mixer-dev \
      libsdl2-ttf-dev \
      libportmidi-dev \
      libswscale-dev \
      libavformat-dev \
      libavcodec-dev \
      zlib1g-dev \
      libgstreamer1.0-dev \
      gstreamer1.0-plugins-base \
      libmtdev-dev \
      autoconf \
      autoconf-archive \
      libtool \
      libtool-bin \
      pkg-config \
      cmake

- name: Build with Buildozer
  env:
    ACLOCAL_PATH: /usr/share/aclocal
  run: |
    buildozer -v android debug 2>&1 | tee 0_build.txt
    exit ${PIPESTATUS[0]}
