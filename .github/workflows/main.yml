name: Build APK
'on':
push:
branches: [main]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-22.04
steps:
- uses: actions/checkout@v4
- name: Install dependencies
run: sudo apt-get update && sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv libffi-dev libssl-dev
- name: Build APK
uses: digreatbrian/buildozer-action@v2
with:
python-version: "3.11"
buildozer-cmd: buildozer android debug
