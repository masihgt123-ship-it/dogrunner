name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # استفاده از ایمیج master که برای buildozer بهینه‌سازی شده است
      image: kivy/buildozer:master
      options: --user root
    env:
      BUILDOZER_ALLOW_ROOT: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with Buildozer
      run: |
        # حذف کش قبلی برای جلوگیری از تداخل
        rm -rf .buildozer
        # اجرای دستور بیلد و تایید خودکار تمامی سوالات با yes
        yes | buildozer android debug

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dogrunner-final-apk
        path: bin/*.apk
