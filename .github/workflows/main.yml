name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3.11 python3.11-venv python3.11-dev \
            build-essential git zip unzip \
            openjdk-17-jdk ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-dev \
            libltdl-dev libtool libtool-bin \
            autoconf autoconf-archive automake pkg-config

      - name: Force Python 3.11 as system default
        run: |
          # حذف هر symlink موجود
          sudo rm -f /usr/bin/python3 /usr/local/bin/python3 /usr/local/bin/python
          # لینک مستقیم به 3.11
          sudo ln -s /usr/bin/python3.11 /usr/bin/python3
          sudo ln -s /usr/bin/python3.11 /usr/local/bin/python3
          sudo ln -s /usr/bin/python3.11 /usr/local/bin/python
          python3 --version
          python --version

      - name: Install pip and tools for Python 3.11
        run: |
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade "pip<25.0" virtualenv wheel

      - name: Install Buildozer and dependencies
        run: |
          python3.11 -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37" \
            "python-for-android==2024.1.21"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build with Buildozer
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          P4A_PYTHON_VERSION: "3.11"
          PYTHON: /usr/bin/python3.11
          VIRTUALENV_PYTHON: /usr/bin/python3.11
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          yes | buildozer -v android debug 2>&1 | tee 0_build.txt
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dogrunner-apk
          path: bin/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: 0_build.txt
